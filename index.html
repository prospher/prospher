<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prospher — Presença digital para advogados</title>
<meta name="description" content="Estrutura completa de tráfego, landing page e atendimento para advogados autônomos pararem de depender só de indicação.">
<link rel="icon" type="image/svg+xml" href="assets/mark.svg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="pr-page">

  <header class="pr-header">
    <div class="pr-header-inner">
      <a href="#topo" class="pr-brand">
        <img src="assets/mark.svg" alt="prospher" class="pr-brand-mark">
        <img src="assets/word.svg" alt="prospher" class="pr-brand-word">
      </a>
      <nav class="pr-nav-links" id="pr-nav-links"></nav>
      <a class="pr-btn pr-nav-cta" data-nav-cta target="_blank" rel="noopener"></a>
      <button class="pr-hamburger" id="pr-hamburger" aria-label="Menu">
        <span class="pr-hamburger-line"></span>
        <span class="pr-hamburger-line"></span>
        <span class="pr-hamburger-line"></span>
      </button>
    </div>
  </header>

  <div class="pr-mobile-panel" id="pr-mobile-panel">
    <div id="pr-mobile-links" style="display:contents"></div>
  </div>

  <section id="topo" class="pr-hero">
    <div>
      <span class="pr-kicker" id="pr-hero-kicker"></span>
      <h1 class="pr-hero-title" id="pr-hero-title"></h1>
      <p class="pr-hero-subtitle" id="pr-hero-subtitle"></p>
      <div class="pr-hero-actions">
        <a href="#" class="pr-btn" id="pr-hero-cta" target="_blank" rel="noopener"></a>
      </div>
      <div class="pr-hero-badges" id="pr-hero-badges"></div>
    </div>

    <div id="pr-hero-conversa" hidden>
      <div class="pr-chat">
        <div class="pr-chat-head">
          <img src="assets/mark.svg" alt="">
          <span class="pr-chat-head-label" id="pr-chat-label"></span>
          <span class="pr-chat-status">
            <span class="pr-chat-status-dot"></span><span id="pr-chat-status-label"></span>
          </span>
        </div>
        <div class="pr-chat-body" id="pr-chat-body"></div>
      </div>
    </div>

    <div id="pr-hero-conexao" hidden>
      <div class="pr-connect">
        <span class="pr-connect-kicker" id="pr-connect-kicker"></span>
        <div class="pr-connect-grid">
          <div class="pr-connect-col" id="pr-connect-left"></div>
          <div class="pr-connect-mid">
            <div class="pr-connect-track"><span></span></div>
            <img src="assets/mark-white.svg" alt="prospher">
            <div class="pr-connect-track"><span style="animation-delay:.9s"></span></div>
          </div>
          <div class="pr-connect-col" id="pr-connect-right"></div>
        </div>
        <p class="pr-connect-caption" id="pr-connect-caption"></p>
      </div>
    </div>
  </section>

  <section id="problema" class="pr-section">
    <div class="pr-container">
      <span class="pr-kicker" id="pr-problema-kicker"></span>
      <h2 class="pr-section-title" id="pr-problema-title"></h2>
      <div class="pr-problem-grid" id="pr-problema-grid"></div>
    </div>
  </section>

  <section id="solucao" class="pr-section">
    <div class="pr-container">
      <span class="pr-kicker" id="pr-solucao-kicker"></span>
      <h2 class="pr-section-title" id="pr-solucao-title"></h2>
      <p class="pr-section-subtitle" id="pr-solucao-subtitle"></p>

      <div class="pr-journey" id="pr-journey">
        <div class="pr-journey-rail"><span class="pr-journey-fill"></span></div>
      </div>

      <div class="pr-hero-actions" style="margin-top:clamp(40px,5vw,56px)">
        <a href="#" class="pr-btn" id="pr-solucao-cta" target="_blank" rel="noopener"></a>
      </div>
    </div>
  </section>

  <section id="recebe" class="pr-section">
    <div class="pr-container">
      <span class="pr-kicker" id="pr-recebe-kicker"></span>
      <h2 class="pr-section-title" id="pr-recebe-title"></h2>
      <div class="pr-pipe-grid" id="pr-pipe"></div>
    </div>
  </section>

  <section id="duvidas" class="pr-section">
    <div class="pr-container pr-faq-layout">
      <div>
        <span class="pr-kicker" id="pr-faq-kicker"></span>
        <h2 class="pr-section-title pr-faq-intro-title" id="pr-faq-title"></h2>
        <p class="pr-faq-intro-subtitle" id="pr-faq-subtitle"></p>
      </div>
      <div class="pr-faq-list" id="pr-faq-list"></div>
    </div>
  </section>

  <section id="contato" class="pr-section" style="padding-top:0">
    <div class="pr-container">
      <div class="pr-contact-card">
        <div class="pr-contact-glow"></div>
        <div class="pr-contact-noise"></div>
        <div class="pr-contact-content">
          <img src="assets/word-white.svg" alt="prospher" class="pr-contact-logo">
          <h2 class="pr-contact-title" id="pr-contato-title"></h2>
          <p class="pr-contact-subtitle" id="pr-contato-subtitle"></p>
          <a href="#" class="pr-btn pr-btn--light" id="pr-contato-cta" target="_blank" rel="noopener"></a>
          <div class="pr-contact-checks" id="pr-contato-checks"></div>
        </div>
      </div>
    </div>
  </section>

  <footer class="pr-footer">
    <div class="pr-footer-grid">
      <div>
        <img src="assets/word-white.svg" alt="prospher" class="pr-footer-logo">
        <p class="pr-footer-desc" id="pr-footer-desc"></p>
        <p class="pr-footer-tagline" id="pr-footer-tagline"></p>
      </div>
      <div>
        <span class="pr-footer-heading" id="pr-footer-nav-label"></span>
        <div class="pr-footer-links" id="pr-footer-nav-links"></div>
      </div>
      <div>
        <span class="pr-footer-heading" id="pr-footer-contact-label"></span>
        <div class="pr-footer-links" id="pr-footer-contact-links"></div>
      </div>
    </div>
    <div class="pr-footer-bottom">
      <div class="pr-footer-bottom-inner">
        <span class="pr-footer-copyright" id="pr-footer-copyright"></span>
        <div class="pr-footer-legal" id="pr-footer-legal"></div>
      </div>
    </div>
  </footer>

  <div class="pr-modal-backdrop" id="pr-seo-modal">
    <div class="pr-modal">
      <div class="pr-modal-head">
        <div>
          <span class="pr-kicker" id="pr-modal-kicker" style="margin-bottom:8px"></span>
          <h2 class="pr-modal-title" id="pr-modal-title"></h2>
        </div>
        <button class="pr-modal-close" id="pr-modal-close" aria-label="Fechar" type="button">×</button>
      </div>
      <div id="pr-modal-groups"></div>
    </div>
  </div>

</div>

<script src="js/content.js"></script>
<script src="js/main.js"></script>
</body>
</html>
